<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OVEQRA Inquiry Dashboard</title><style>body{font-family:Arial,sans-serif;background:#faf9f6;color:#25252b;padding:30px}.wrap{max-width:1000px;margin:auto}.card{background:#fff;border:1px solid #e7e3eb;border-radius:18px;padding:18px;margin:12px 0}.top{display:flex;justify-content:space-between;gap:12px}.muted{color:#777;font-size:13px}.btn{border:0;border-radius:10px;padding:10px 13px;cursor:pointer}.danger{background:#25252b;color:#fff}.empty{padding:50px;text-align:center;color:#777}</style></head><body><div class="wrap"><h1>OVEQRA — Project Inquiries</h1><p class="muted">Browser-local inquiry dashboard for testing. For a real business launch, connect a shared backend/database.</p><div id="list"></div><button class="btn danger" onclick="clearAll()">Clear all inquiries</button></div><script>function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function render(){const d=JSON.parse(localStorage.getItem('oveqra_inquiries')||'[]').reverse(),e=document.getElementById('list');if(!d.length){e.innerHTML='<div class="empty">No inquiries yet.</div>';return}e.innerHTML=d.map(x=>'<div class="card"><div class="top"><strong>'+esc(x.name)+' · '+esc(x.service)+'</strong><span class="muted">'+esc(x.createdAt)+'</span></div><p><b>Email:</b> '+esc(x.email)+' · <b>Market:</b> '+esc(x.country||'—')+' · <b>Currency:</b> '+esc(x.currency||'—')+' · <b>Budget:</b> '+esc(x.budget||'—')+' · <b>Timeline:</b> '+esc(x.timeline||'—')+'</p><p><b>Company:</b> '+esc(x.company||'—')+'</p><p>'+esc(x.message)+'</p></div>').join('')}function clearAll(){if(confirm('Delete all inquiries from this browser?')){localStorage.removeItem('oveqra_inquiries');render()}}render();</script></body></html>
